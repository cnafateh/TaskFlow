name: CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./TaskFlow.slnx

      - name: Build
        run: dotnet build ./TaskFlow.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ./TaskFlow.Tests/TaskFlow.Tests.csproj -c Release --no-build